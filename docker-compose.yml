services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_strategy}
      POSTGRES_USER: ${POSTGRES_USER:-product_strategy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-this}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-product_strategy}:${POSTGRES_PASSWORD:-local-dev-change-this}@postgres:5432/${POSTGRES_DB:-product_strategy}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./projects:/app/projects

volumes:
  postgres-data:
