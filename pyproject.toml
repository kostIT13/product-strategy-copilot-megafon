[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-strategy-agent"
version = "0.1.0"
description = "Portable CLI for evidence-based product strategy work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
psa = "product_strategy_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
