name: demo

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  LLM_API_KEY: ''
  LLM_BASE_URL: https://provider.invalid/v1

jobs:
  local-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.30'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --no-default-groups
      - name: Validate, verify, resume and rebuild synthetic cases in temporary copies
        run: uv run --frozen --no-sync python -m scripts.ci.demo --report demo-report.json
      - name: Check offline research provenance, refusal and source lifecycle
        run: uv run --frozen --no-sync python -m scripts.ci.research_smoke --report research-report.json
      - name: Summarize demo checks
        if: always()
        shell: bash
        run: |
          for report in demo-report.json research-report.json; do
            if [ -f "$report" ]; then
              printf '### %s\n\n```json\n' "$report" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
