name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  LLM_API_KEY: ''
  LLM_BASE_URL: https://provider.invalid/v1
  LITELLM_LOCAL_MODEL_COST_MAP: 'True'

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.30'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen --no-sync python -m scripts.ci.docs
      - run: uv run --frozen --no-sync python scripts/sync_harness.py --check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.30'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --no-default-groups
      - name: Install checksum-pinned native Gitleaks
        shell: bash
        run: |
          uv run --frozen --no-sync python -m scripts.ci.install_gitleaks --directory "$RUNNER_TEMP/psa-tools"
          echo "$RUNNER_TEMP/psa-tools" >> "$GITHUB_PATH"
      - name: Check history, safe working tree and generated negative probes
        run: uv run --frozen --no-sync python -m scripts.ci.secrets

  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            timeout: 15
          - os: ubuntu-latest
            python: '3.12'
            timeout: 15
          - os: windows-latest
            python: '3.12'
            timeout: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.30'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --extra agent --extra documents --extra mcp --group dev
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync python -m unittest discover -s tests
      - run: uv run --frozen --no-sync psa doctor

  base-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.30'
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --frozen --no-default-groups
      - run: uv run --frozen --no-sync psa doctor
      - run: uv run --frozen --no-sync psa --help
      - run: uv run --frozen --no-sync python -m scripts.ci.base_smoke
