name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  demo:
    uses: ./.github/workflows/demo.yml
  package:
    needs: [ci, demo]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.30'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Build release from verified commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          if [ "$REF_TYPE" = tag ]; then
            uv run --frozen --no-sync python -m scripts.release.package --require-clean --tag "$RELEASE_TAG"
          else
            uv run --frozen --no-sync python -m scripts.release.package --require-clean
          fi
      - name: Verify wheel and sdist installation from archive
        shell: bash
        run: uv run --frozen --no-sync python -m scripts.release.verify dist/release/product-strategy-agent-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified assets and create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_COMMIT"
          gh run download "$RUN_ID" --repo "$GH_REPO" --name release-bundle --dir assets
          gh release create "$RELEASE_TAG" assets/* --repo "$GH_REPO" --verify-tag --draft --title "$RELEASE_TAG" --notes "Verified distribution; see SHA256SUMS and release-manifest.json."
